name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that OpenBlock does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: This keeps OpenBlock local-first, without accounts or tracking.
          required: true
