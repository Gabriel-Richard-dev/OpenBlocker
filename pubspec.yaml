name: openblock
description: "An open-source, privacy-first mobile app to help you break infinite scrolling and regain control of your attention."
publish_to: 'none'
repository: https://github.com/Gabriel-Richard-dev/OpenBlocker

version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
